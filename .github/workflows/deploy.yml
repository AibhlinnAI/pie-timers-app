# ============================================================
# Publish the app to GitHub Pages at https://pietimers.aibhlinn.ai
#
# The published site is app/ plus identity/. identity/ lives at the
# repo root, a sibling of app/ rather than nested inside it, because it
# is the shared AibhlínnAI sign-in module a future suite app will also
# use — keeping it out of app/ is what makes that literally true, not
# just a comment. The deploy step assembles the two into one folder
# before upload; nothing else in the repo (supabase/, DEPLOY.md, the
# workflow itself) is served.
#
# There is no build step. The files that run in the browser are the
# files in the repo, which is the whole point of the no-dependency
# design: nothing is transformed between what you can read and what
# your customers execute.
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish the newer one and drop the older.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    name: Refuse to publish secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A public repo plus a pasted key is the single most common way a
      # small project gets its bill run up by strangers. Fail loudly
      # rather than publish. If this ever trips, rotate the key first
      # and fix the file second — it is already public by then.
      - name: Scan app/ and identity/ for private keys
        run: |
          set -u
          fail=0

          # Literal secret formats. None of these has any business in a
          # file the browser downloads.
          if grep -rnE 'BEGIN [A-Z ]*PRIVATE KEY|sk_live_|sk_test_|whsec_|GOCSPX-' app/ identity/; then
            echo "::error::A secret is present in app/ or identity/."
            fail=1
          fi

          # The Supabase anon key is a JWT and belongs in config.js. The
          # service-role key is also a JWT and looks almost identical —
          # which is exactly why this checks the decoded payload rather
          # than the variable name it was pasted into.
          for token in $(grep -rhoE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}' app/ identity/ || true); do
            payload=$(printf '%s' "$token" | cut -d. -f2)
            case $(( ${#payload} % 4 )) in
              2) payload="$payload==" ;;
              3) payload="$payload=" ;;
            esac
            if printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null | grep -q 'service_role'; then
              echo "::error::A service-role JWT is in app/. It bypasses row-level security. Rotate it in Supabase now, then remove it."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "No private keys found in app/ or identity/."

      # No ads, no tracking, no third-party analytics is a permanent
      # product principle (see ARCHITECTURE.md), not a preference that
      # can quietly drift the next time someone adds "just one" SDK to
      # debug a bug or measure growth. This is what makes that a build
      # failure instead of a hope. First-party, aggregate, disclosed
      # analytics are still allowed — this only catches known
      # third-party ad/tracking vendors' own domains and script globals.
      - name: Refuse to publish ad or tracking dependencies
        run: |
          set -u
          fail=0
          pattern='google-analytics\.com|googletagmanager\.com|doubleclick\.net|googlesyndication\.com|googleadservices\.com|amazon-adsystem\.com|facebook\.net|connect\.facebook\.com|fbq\(|gtag\(|mixpanel|segment\.(io|com)|hotjar|amplitude\.com|clarity\.ms|matomo|posthog|sentry\.io|bugsnag|fullstory|crazyegg|adroll'

          if grep -rniE "$pattern" app/ identity/; then
            echo "::error::An ad or tracking dependency's domain/global was found in app/ or identity/. This app's no-ads-no-tracking commitment (ARCHITECTURE.md) is meant to break the build if this happens, not just be a promise on a page. Remove it, or if this is a genuine first-party analytics addition, update this pattern deliberately alongside the ARCHITECTURE.md note explaining what changed and why."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "No ad or tracking dependencies found in app/ or identity/."

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # app/ and identity/ are separate folders in the repo (identity/
      # deliberately outside app/, see the note at the top of this
      # file) but one folder on the served site. site/identity/ is
      # what app/index.html actually requests.
      - name: Assemble the published site
        run: |
          mkdir -p site
          cp -r app/. site/
          cp -r identity site/identity

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
