<title>Pie Timers feature graphic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Instrument+Sans:wght@400;500&display=swap');
  html,body{margin:0;padding:24px;background:#5a5a5a}

  /* Exactly the size Google Play requires. Do not change.
     Ground is #1C1024 -- the Pie Timers app colour, the PWA theme-color,
     and the same ground the logo tile uses, so the mark reads as the logo
     rather than as a tile pasted onto a banner. */
  #graphic{
    width:1024px; height:500px; position:relative; overflow:hidden;
    background:#1C1024;
    font-family:"Instrument Sans",system-ui,sans-serif;
    display:grid; grid-template-columns:1fr 430px; align-items:center;
  }
  .copy{padding:0 0 0 80px}
  /* Mixed case always -- brand/README.md. Never all-caps.
     Brushed titanium, sampled from app/aibhlinn-logo.png: a cool metal
     running #656976 through #CED1D8 to a #F8FAFD highlight. Flat
     #CED1D8 is the fallback for anywhere background-clip is unavailable. */
  .wordmark{
    font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:20px; font-weight:500; letter-spacing:.015em;
    margin:0 0 22px;
    color:#CED1D8;
    background:linear-gradient(176deg,
      #F8FAFD 0%, #DDE0E7 30%, #8E9199 52%,
      #EDEFF3 68%, #AEB1B8 88%, #CED1D8 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    width:max-content;
  }
  h1{
    font-family:Fraunces,Georgia,serif; font-weight:700;
    font-size:76px; line-height:.98; letter-spacing:-.02em;
    color:#F6D7B0; margin:0 0 22px;
  }
  p.tag{
    font-size:26px; line-height:1.3; color:#E6DCEE; margin:0 0 30px;
    max-width:17ch; font-weight:400;
  }
  p.foot{
    font-size:15px; letter-spacing:.05em; color:#9C8BA8; margin:0; font-weight:500;
  }
  .mark{display:block; margin:0 auto}
</style>

<div id="graphic">
  <div class="copy">
    <p class="wordmark">AibhlínnAI</p>
    <h1>Pie&nbsp;Timers</h1>
    <p class="tag">Know where you are in your day.</p>
    <p class="foot">No ads · No tracking · Works offline</p>
  </div>

  <!-- The logo, exactly as app/icon.svg draws it: plate #32493C at r184,
       pie #FF8A00 at r150 with 19/22 remaining. There is no colour for the
       eaten part -- eat a slice and you see the plate. The tile is omitted
       because the graphic's own ground is already #1C1024. -->
  <svg class="mark" width="360" height="360" viewBox="0 0 512 512"
       role="img" aria-label="Pie Timers logo: an orange pie on a green plate">
    <circle cx="256" cy="256" r="184" fill="#32493C"/>
    <circle cx="256" cy="256" r="184" fill="none" stroke="#3E5A4A" stroke-width="4"/>
    <path d="M256 256 369.4 157.7A150 150 0 1 1 256 106z" fill="#FF8A00"
          stroke="rgba(0,0,0,.3)" stroke-width="3"/>
  </svg>
</div>
