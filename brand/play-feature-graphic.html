<meta charset="utf-8">
<title>Pie Timers feature graphic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
  html,body{margin:0;padding:24px;background:#5a5a5a}

  /* Exactly the size Google Play requires. Do not change.
     Ground is #1C1024 -- the Pie Timers app colour and PWA theme-color,
     the same ground the logo tile uses, so the mark reads as the logo
     rather than as a tile pasted onto a banner. */
  #graphic{
    width:1024px; height:500px; position:relative; overflow:hidden;
    background:#1C1024;
    font-family:"Instrument Sans",system-ui,"Segoe UI",sans-serif;
    /* The text and the mark are one lockup, centred as a pair, with the
       gap set here rather than left over from space-between -- which
       spent every spare pixel between them and pushed the mark away.
       Change --gap alone to tighten or loosen it. */
    --gap:44px;
    display:flex; align-items:center; justify-content:center;
    gap:var(--gap); padding:0 40px;
  }

  .copy{display:flex; flex-direction:column; flex:0 1 auto}

  /* First in the stack, and the pie's own orange -- as on the business
     card, where "Pie Timers" is #FF8A00 at weight 700.
     Orange with the app banner's green shadow (.brand-text h1 in
     app/styles.css): a hard #32493C offset -- the plate green, so the
     title carries the same pie-on-plate logic as the mark -- plus a soft
     dark drop. The app sets 2px on ~24px type. Scaling that ratio to 78px gave
     5px, which rendered as mass rather than as an edge -- a retro
     arcade offset, not the app's quiet lift. 3px is the size that
     preserves the impression rather than the arithmetic. */
  h1{
    font-size:78px; font-weight:700; line-height:1;
    letter-spacing:-.01em; color:#FF8A00; margin:0 0 24px;
    text-shadow:3px 3px 0 #32493C, 0 4px 18px rgba(0,0,0,.5);
  }

  /* Broken by hand at "know" so it sets as two balanced lines and "day"
     finishes the second, rather than being left alone on a third.

     A lifted mint, not the app's #6FD08C. Against the orange title that
     mint measured 1.25:1 -- near-identical lightness -- so for the ~8%
     of men with red-green colour vision deficiency the title and this
     line collapsed into two matching greys and the hierarchy survived on
     size alone. #A8E6C0 opens that to 1.66:1, putting lightness rather
     than hue in charge of the difference. Darkening was tried first and
     is worse (1.24:1): it approaches the orange from underneath. */
  p.tag{
    font-size:27px; line-height:1.34; color:#A8E6C0;
    margin:0 0 28px; font-weight:400; white-space:nowrap;
  }

  /* The three claims. Still quieter than the tagline and set apart from
     the wordmark, so they read as facts rather than as part of either the
     promise above or the signature below -- but raised from 16px/#9C8BA8,
     which whispered the one thing on this graphic a store full of
     ad-stuffed timer apps cannot say back. */
  p.claims{
    font-size:18px; font-weight:500; letter-spacing:.05em;
    color:#B6A7C0; margin:0 0 38px;
  }

  /* The signature: the "Ai" mark then the wordmark, in that order. Left,
     not right -- the mark's left edge then lines up with the H1 and the
     tagline above it, and the pie already pulls the eye right, so a second
     mark over there would double that pull. Tight gap on purpose: the two
     are one signature, not two things that happen to sit near each other. */
  .signature{display:flex; align-items:center; gap:10px}

  /* The AibhlínnAI mark, inlined as a data URI so the file carries no
     external reference and can be moved or captured anywhere. Re-inlined
     from aibhlinn-mark-512.png once this passed 40px: the 80px source no
     longer had 2x headroom for a high-DPI capture.

     56px mark against 27px type keeps the 2.07 ratio the pair had at
     44/21 -- both grew together, neither took over.

     The mark is navy on a purple ground, and a hard edge between two
     unrelated darks reads as pasted on. Three rings of one colour fix
     that without announcing themselves: a 1px lip in #4B2A5A, the app's
     own mid purple, so the ground appears to stop *around* the mark
     rather than behind it; the same purple at low alpha, spread wider,
     as a bed for the lip to sit in; then a soft blur of it dissolving
     the bed's outer edge. No drop shadow -- a shadow would lift it off
     the ground, which is the opposite of being held by it. */
  .ai-icon{
    width:56px; height:56px; flex:none; display:block;
    border-radius:13px;
    box-shadow:
      0 0 0 1px #4B2A5A,
      0 0 0 6px rgba(75, 42, 90, .30),
      0 0 12px 6px rgba(75, 42, 90, .16);
  }

  /* Mixed case always -- brand/README.md. Never all-caps.
     Flat #E9ECF1, not the titanium gradient. Rendered at 27px the
     gradient was indistinguishable from a solid light grey: the metal
     only declares itself at the sizes it has in the logo lockup. The
     gradient stays documented in brand/README.md for surfaces big
     enough to show it. */
  .wordmark{
    font-size:27px; font-weight:500; letter-spacing:.02em;
    margin:0; width:max-content;
    color:#E9ECF1;
  }

  .mark{display:block; flex:none}
</style>
