# ============================================================
# Publish this repo to GitHub Pages at https://aibhlinn.ai
#
# The guard job is copied from pie-timers-app's deploy.yml, trimmed to
# this repo. It runs before every publish, so a pasted secret or an ad
# or tracking dependency fails the build instead of going live. The
# no-ads-no-tracking promise in the footer of index.html is meant to be
# enforced, not just stated.
#
# There is no build step. The files the browser runs are the files in
# the repo. The deploy uploads the repo root minus the repo's own
# plumbing (.git, .github, README.md).
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    name: Refuse to publish secrets or trackers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for private keys
        run: |
          set -u
          if grep -rnE --exclude-dir=.git --exclude-dir=.github 'BEGIN [A-Z ]*PRIVATE KEY|sk_live_|sk_test_|whsec_|GOCSPX-|eyJ[A-Za-z0-9_-]{10,}\.eyJ' .; then
            echo "::error::A secret is present. Rotate it first, then remove it. It is already public."
            exit 1
          fi
          echo "No private keys found."

      - name: Refuse to publish ad or tracking dependencies
        run: |
          set -u
          pattern='google-analytics\.com|googletagmanager\.com|doubleclick\.net|googlesyndication\.com|googleadservices\.com|amazon-adsystem\.com|facebook\.net|connect\.facebook\.com|fbq\(|gtag\(|mixpanel|segment\.(io|com)|hotjar|amplitude\.com|clarity\.ms|matomo|posthog|sentry\.io|bugsnag|fullstory|crazyegg|adroll'
          if grep -rniE --exclude-dir=.git --exclude-dir=.github "$pattern" .; then
            echo "::error::An ad or tracking dependency was found. This site promises no ads and no tracking."
            exit 1
          fi
          echo "No ad or tracking dependencies found."

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Assemble the published site
        run: |
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='site' --exclude='README.md' ./ site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
